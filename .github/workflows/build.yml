
name: Build CleanGuard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      PROJECT_DIR: APLAYFIRE_v1.3/CleanGuard

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Verify Project Structure
        run: |
          echo "Checking Android project..."
          pwd
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -d "$PROJECT_DIR/app"

      - name: Build Debug APK
        working-directory: APLAYFIRE_v1.3/CleanGuard
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CleanGuard-APK
          path: APLAYFIRE_v1.3/CleanGuard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Show Kotlin Compilation Errors
        if: failure()
        working-directory: APLAYFIRE_v1.3/CleanGuard
        run: |
          echo "Build failed. Showing Kotlin diagnostics..."
          gradle compileDebugKotlin --stacktrace --info
