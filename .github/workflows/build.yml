
name: Build CleanGuard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Verificar projeto
        run: |
          cd APLAYFIRE_v1.3/CleanGuard
          echo "Arquivos encontrados:"
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts

      - name: Compilar APK
        run: |
          cd APLAYFIRE_v1.3/CleanGuard

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanGuard-APK
          path: APLAYFIRE_v1.3/CleanGuard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
