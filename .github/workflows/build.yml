
name: Build CleanGuard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./CleanGuard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Verify Gradle
        run: |
          echo "Verificando projeto..."
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanGuard-APK
          path: CleanGuard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
