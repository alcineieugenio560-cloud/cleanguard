
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Check project
        run: |
          pwd
          ls -la
          find . -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: gradle -p . assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanGuard-apk
          path: app/build/outputs/apk/debug/*.apk
