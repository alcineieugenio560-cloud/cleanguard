@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#150709;--card:#230f12;--ink:#fbeff0;--mut:#c4a5a8;--line:#3b1b1f;--soft:#2e1317;--ok:#4cc98a}}
:root[data-theme="dark"]{--bg:#150709;--card:#230f12;--ink:#fbeff0;--mut:#c4a5a8;--line:#3b1b1f;--soft:#2e1317;--ok:#4cc98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:40}
button{font:inherit;border:0;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
button:active{transform:scale(.96)}button:disabled{opacity:.55}
.rp{position:absolute;border-radius:50%;background:rgba(214,31,38,.28);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
/* splash */
#splash{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .8s cubic-bezier(.77,0,.18,1),opacity .8s}
#splash.out{transform:translateY(-100%);opacity:.4}
.glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,140,40,.35),rgba(214,31,38,.12) 50%,transparent 70%);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.25);opacity:.7}}
.smk{width:150px;position:relative;animation:mk 1.2s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes mk{from{opacity:0;transform:scale(.5) rotate(-14deg);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
.stx{width:210px;margin-top:16px;position:relative;animation:tx 1s .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes tx{from{opacity:0;transform:translateY(18px);letter-spacing:8px;clip-path:inset(0 100% 0 0)}to{opacity:1;transform:none;clip-path:inset(0)}}
.ld{width:150px;height:4px;border-radius:9px;background:#f3e3e4;margin-top:34px;overflow:hidden;position:relative}
.ld i{display:block;height:100%;background:linear-gradient(90deg,#ffb400,var(--red),var(--blue));animation:ld 1.9s .3s ease-in-out forwards;width:0}
@keyframes ld{to{width:100%}}
/* header */
header{position:relative;background:radial-gradient(120% 90% at 50% 0,#ee3a40,var(--red) 45%,var(--red2));color:#fff;padding:16px 18px 28px;border-radius:0 0 38px 38px;text-align:center;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top{position:relative;display:flex;justify-content:space-between;align-items:center}
.pill{background:#fff;border-radius:99px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.pill img:first-child{height:26px}.pill img:last-child{height:15px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:5px 11px;border-radius:99px}
.chip i{width:8px;height:8px;border-radius:50%;background:#fff;animation:dot 1.4s infinite}
@keyframes dot{50%{transform:scale(1.8);opacity:.3}}
.radar{position:relative;width:min(240px,66vw);aspect-ratio:1;margin:22px auto 10px}
.radar svg{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;inset:7%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 250deg,rgba(255,255,255,.5) 359deg,transparent 360deg);animation:spin 4s linear infinite}
.scan .sweep{animation-duration:1.1s}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{position:absolute;inset:30%;border-radius:50%;border:2px solid rgba(255,255,255,.6);animation:wave 2.6s ease-out infinite}
.wave:nth-of-type(2){animation-delay:1.3s}
@keyframes wave{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.sh{position:absolute;inset:34%;background:#fff;-webkit-mask:var(--shield) center/contain no-repeat;mask:var(--shield) center/contain no-repeat;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.done .sh{animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5)}}
.bp{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffd27a;box-shadow:0 0 12px #ffd27a;animation:bp 1.6s forwards}
@keyframes bp{0%{transform:scale(0)}20%{transform:scale(1.6)}100%{transform:scale(1);opacity:0}}
#arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.sc{position:relative;font-size:46px;font-weight:800;line-height:1}
.sl{position:relative;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;opacity:.85;margin:2px 0 8px}
.msg{position:relative;min-height:22px;margin:0 0 16px;transition:opacity .3s}
.cta{position:relative;background:#fff;color:var(--red);font-weight:800;font-size:16px;border-radius:99px;padding:15px 30px;width:100%;max-width:320px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(214,31,38,.18),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{left:130%}}
main{padding:20px 16px 30px;max-width:560px;margin:0 auto}
.in{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.09s + 1.9s)}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(214,31,38,.06)}
.row{display:flex;align-items:center;gap:12px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--red);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.col{flex:1;min-width:0}.col b{display:block}.col small{color:var(--mut)}
.bar{height:8px;background:var(--soft);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff9a3c,var(--red));transition:width 1.2s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:bs 2s infinite;transform:translateX(-100%)}
@keyframes bs{to{transform:translateX(100%)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.act{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:18px 10px 14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(214,31,38,.06)}
.act .ico{width:52px;height:52px;border-radius:16px}
.act img{width:34px;height:34px;object-fit:contain}
.mi{width:28px;height:28px;background:var(--red);-webkit-mask:var(--shield) center/contain no-repeat;mask:var(--shield) center/contain no-repeat}
.wide{width:100%;background:linear-gradient(100deg,var(--red),#f0592b);color:#fff;border-radius:18px;padding:16px;font-weight:800;margin-bottom:12px;display:none;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(214,31,38,.35)}
.wide img{width:26px;height:26px;object-fit:contain}
h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;margin:20px 4px 10px;color:var(--red)}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:10px 12px;margin-bottom:10px;animation:up .6s both;animation-delay:calc(var(--i)*.1s)}
.item b{display:block}.item small{color:var(--mut);display:block;word-break:break-all}
.item ul{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:13px}
.badge{float:right;background:var(--red);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.sw{position:relative;height:84px;overflow:hidden;animation:up .4s both}
.jk{display:flex;justify-content:space-around;align-items:center;height:100%}
.jk span{width:16px;height:16px;border-radius:4px;background:#e0a0a3;animation:fly 1.7s ease-in forwards;animation-delay:calc(var(--i)*.11s)}
.jk span:nth-child(3n){background:#f3c27a}.jk span:nth-child(4n){width:11px;height:11px}
@keyframes fly{40%{transform:translateX(10px) rotate(40deg)}100%{transform:translate(120px,-34px) rotate(260deg) scale(0);opacity:0}}
.brm{position:absolute;top:10px;left:-60px;width:64px;animation:brm 1.7s ease-in-out forwards;transform-origin:70% 90%}
@keyframes brm{0%{left:-60px;transform:rotate(-10deg)}50%{transform:rotate(14deg)}100%{left:105%;transform:rotate(-8deg)}}
.okc{display:flex;align-items:center;gap:14px;animation:up .6s both}
.okc svg{width:56px;height:56px;flex:none}
.okc circle,.okc path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:160;stroke-dashoffset:160;animation:dr .8s .15s forwards}
.okc path{stroke-dasharray:40;stroke-dashoffset:40;animation-delay:.7s}
@keyframes dr{to{stroke-dashoffset:0}}
.okc big{font-size:24px;font-weight:800;color:var(--ok)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;opacity:0;transform:translateY(14px);transition:.3s;pointer-events:none;text-align:center;z-index:30}
.toast.on{opacity:1;transform:none}
.ft{text-align:center;color:var(--mut);font-size:12px;margin-top:22px}
.prot .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stats b{font-size:20px;display:block}.stats small{color:var(--mut);font-size:11px}
.sw2{width:52px;height:30px;border-radius:99px;background:#d8c7c8;padding:0;flex:none;transition:background .3s}
.sw2 i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.2,1.5,.4,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw2.on{background:var(--ok)}.sw2.on i{transform:translateX(22px)}
.prot.on{border-color:var(--ok)}.prot.on .ico{background:var(--ok);animation:pulse 2s infinite}.prot.on .mi{background:#fff}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(31,138,76,.5)}to{box-shadow:0 0 0 14px rgba(31,138,76,0)}}
.link{background:none;color:var(--red);font-weight:700;padding:10px 0 0;width:100%;text-align:center}
.item.warn{border-left-color:#f08a1c}.badge.warn{background:#f08a1c}
.acts{margin-top:8px}.mini{background:var(--soft);color:var(--red);font-weight:700;border-radius:99px;padding:7px 14px;font-size:13px;border:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
var $=function(s){return document.querySelector(s)},native=window.Android,full=false,junkBytes=0,threats=null,T0=0,MIN=2400,tk,bp;
function fmt(b){var u=['B','KB','MB','GB','TB'],i=0;while(b>=1024&&i<4){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2800)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function cnt(el,to,fm,ms){var t=Date.now();(function f(){var k=Math.min(1,(Date.now()-t)/(ms||1100));k=1-Math.pow(1-k,3);el.textContent=fm(to*k);if(k<1)requestAnimationFrame(f)})()}
function busy(on,t){['#full','#bScan','#bJunk','#bClean'].forEach(function(s){$(s).disabled=on});if(t)$('#msg').textContent=t}
function fin(fn){setTimeout(fn,Math.max(0,MIN-(Date.now()-T0)))}
function begin(){T0=Date.now();document.body.classList.add('scan');$('#hd').classList.remove('done');$('#chip').textContent='Analisando';
  var S=['Analisando permissões dos apps','Verificando origem das instalações','Comparando assinaturas conhecidas','Procurando arquivos temporários'],i=0;
  $('#msg').textContent=S[0];clearInterval(tk);clearInterval(bp);
  tk=setInterval(function(){$('#msg').textContent=S[++i%S.length]},800);
  bp=setInterval(function(){var d=document.createElement('div'),a=Math.random()*6.28,r=14+Math.random()*30;d.className='bp';d.style.left=(50+Math.cos(a)*r)+'%';d.style.top=(50+Math.sin(a)*r)+'%';$('#radar').appendChild(d);setTimeout(function(){d.remove()},1600)},260)}
function end(m,c){clearInterval(tk);clearInterval(bp);document.body.classList.remove('scan');$('#hd').classList.add('done');$('#chip').textContent=c;busy(false,m)}
function setScore(){var s=Math.max(0,100-(threats||0)*15-(junkBytes>5e8?10:0));cnt($('#score'),s,Math.round);$('#arc').style.strokeDashoffset=703.7*(1-s/100)}
function status(){
  var s=JSON.parse(native?native.status():JSON.stringify({rt:6e9,rf:2.4e9,st:128e9,sf:41e9,v:'14'}));
  $('#ramT').textContent=fmt(s.rf)+' livres de '+fmt(s.rt);$('#stT').textContent=fmt(s.sf)+' livres de '+fmt(s.st);
  setTimeout(function(){$('#ramB').style.width=(100-s.rf/s.rt*100)+'%';$('#stB').style.width=(100-s.sf/s.st*100)+'%'},2200);
  $('#ver').textContent='APLAYFIRE 1.0 • Android '+s.v;
}
function call(n){
  if(native){native[n]();return}
  setTimeout(function(){
    if(n=='scan')onNative('scan',[{n:'Super Bateria Pro',p:'com.exemplo.bateria',r:9,w:['Instalado fora de loja confiável','Permissão: BIND_ACCESSIBILITY_SERVICE','Permissão: SYSTEM_ALERT_WINDOW']},{n:'Jogo Grátis',p:'com.exemplo.jogo',r:5,w:['Instalado fora de loja confiável','Permissão: READ_CONTACTS']}]);
    if(n=='findJunk')onNative('junk',{c:128,b:312e6,f:['/storage/emulated/0/DCIM/.thumbdata3','/storage/emulated/0/Download/log.bak']});
    if(n=='clean')onNative('clean',{b:312e6});
  },600);
}
function onNative(t,d){
  if(t=='prot'){P=d;renderP();return}
  if(t=='sigs'){toast(d.n>=0?'Assinaturas atualizadas: '+d.n:d.n==-1?'Defina a URL das assinaturas no código (SignatureUpdater)':'Falha ao atualizar assinaturas');prot();return}
  var r=$('#res');
  if(t=='scan'){fin(function(){
    threats=d.length;setScore();
    r.innerHTML='<h2>Resultado da verificação</h2>'+(d.length?d.map(function(f,i){
      return '<div class="item" style="--i:'+i+'"><span class="badge">risco '+f.r+'</span><b>'+esc(f.n)+'</b><small>'+esc(f.p)+'</small><ul>'+f.w.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'}).join(''):'<div class="card okc"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/><path d="M19 31l8 8 15-17"/></svg><div><big>Tudo seguro</big><br><small>Nenhum app suspeito encontrado.</small></div></div>');
    if(full){$('#msg').textContent='Procurando arquivos inúteis';call('findJunk')}else end(d.length?d.length+' app(s) precisam de atenção':'Seu celular está seguro',d.length?'Atenção':'Protegido');
  })}
  else if(t=='junk'){fin(function(){
    junkBytes=d.b;if(threats!=null)setScore();var was=full;full=false;end(d.c?'Encontrei lixo para limpar':'Nada para limpar',threats?'Atenção':'Otimizado');
    r.insertAdjacentHTML('beforeend','<h2>Arquivos inúteis</h2><div class="card"><b>'+d.c+' arquivo(s) • '+fmt(d.b)+'</b>'+d.f.map(function(p){return '<small style="color:var(--mut);word-break:break-all;display:block">'+esc(p)+'</small>'}).join('')+'</div>');
    if(d.c>0){$('#cleanT').textContent='Limpar '+fmt(d.b);$('#bClean').style.display='flex'}
  })}
  else if(t=='perm'){full=false;end('Permissão necessária','Pendente');toast('Conceda acesso a arquivos e toque novamente.')}
  else if(t=='clean'){setTimeout(function(){
    junkBytes=0;setScore();end('Tudo limpo!','Otimizado');$('#bClean').style.display='none';
    r.innerHTML='<div class="card okc"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/><path d="M19 31l8 8 15-17"/></svg><div><big id="fr">0 B</big><br><small>de espaço liberado</small></div></div>';
